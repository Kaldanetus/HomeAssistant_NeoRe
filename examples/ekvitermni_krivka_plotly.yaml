# NeoRé – jednoduchý graf ekvitermní křivky
#
# Vyžaduje HACS kartu: Plotly Graph Card (dbuezas/lovelace-plotly-graph-card).
# Před použitím nahraďte 4 hodnoty entity: níže skutečnými entity_id
# vašich NeoRé bodů ekvitermní křivky v Home Assistantu.

type: custom:plotly-graph
title: Ekvitermní křivka
raw_plotly_config: true
config:
  displayModeBar: false
  staticPlot: true
entities:
  # Tyto 4 interní entity zajišťují překreslení grafu po změně bodu křivky.
  - entity: number.NAHRADIT_TEMP_EKV_A
    internal: true
  - entity: number.NAHRADIT_TEMP_EKV_B
    internal: true
  - entity: number.NAHRADIT_TEMP_EKV_C
    internal: true
  - entity: number.NAHRADIT_TEMP_EKV_D
    internal: true

  # Vlastní křivka ze 4 bodů NeoEkvValue.TempEkvA…D.
  - entity: ""
    name: Ekvitermní křivka
    mode: lines+markers+text
    line:
      width: 3
      shape: linear
    marker:
      size: 12
    textposition: top center
    fn: |
      $fn ({ vars, hass }) => {
        const ids = [
          "number.NAHRADIT_TEMP_EKV_A",
          "number.NAHRADIT_TEMP_EKV_B",
          "number.NAHRADIT_TEMP_EKV_C",
          "number.NAHRADIT_TEMP_EKV_D"
        ];

        vars.x = [-20, -7, 6, 19];
        vars.y = ids.map((id) => {
          const value = parseFloat(hass.states[id]?.state);
          return Number.isFinite(value) ? value : null;
        });
        vars.text = vars.y.map((value) =>
          value === null ? "" : `${value.toFixed(1)} °C`
        );
      };
    x: $fn ({ vars }) => vars.x
    y: $fn ({ vars }) => vars.y
    text: $fn ({ vars }) => vars.text

layout:
  height: 300
  showlegend: false
  margin:
    t: 35
    l: 60
    r: 25
    b: 65
  xaxis:
    title:
      text: Venkovní teplota
      standoff: 15
    tickvals:
      - -20
      - -7
      - 6
      - 19
    ticktext:
      - "−20 °C"
      - "−7 °C"
      - "+6 °C"
      - "+19 °C"
    range:
      - -22
      - 21
    showgrid: true
    zeroline: false
  yaxis:
    title:
      text: Požadovaná teplota vody
      standoff: 10
    ticksuffix: " °C"
    rangemode: normal
    showgrid: true
    zeroline: false
